name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK
        run: npm install

      # 1. Clonar el SDK Nativo de Android en una carpeta fija dentro de 'example'
      - name: Clonar SDK Nativo Android localmente
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'example/android/native-sdk'

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 2. Reemplazar la dependencia remota por el proyecto local en el gradle del módulo de React Native
      - name: Vincular el SDK nativo localmente en Gradle
        run: |
          python3 -c "
          # Ajustar settings.gradle para incluir el módulo nativo
          settings_path = 'example/android/settings.gradle'
          with open(settings_path, 'r') as f:
              settings_content = f.read()
          
          include_sdk = '\ninclude \":sdk\"\nproject(\":sdk\").projectDir = new File(\"$rootDir/native-sdk/sdk\")\n'
          if ':sdk' not in settings_content:
              settings_content += include_sdk
              with open(settings_path, 'w') as f:
                  f.write(settings_content)

          # Modificar la dependencia en el build.gradle de open-wearables para que use el proyecto local
          build_gradle_path = 'node_modules/open-wearables/android/build.gradle'
          try:
              with open(build_gradle_path, 'r') as f:
                  bg_content = f.read()
              # Cambiar implementation 'com.openwearables.health:sdk:...' por implementation project(':sdk')
              import re
              bg_content = re.sub(r'implementation\s*[\"\x27]com\.openwearables\.health:sdk:.*?[\"\x27]', 'implementation project(\":sdk\")', bg_content)
              with open(build_gradle_path, 'w') as f:
                  f.write(bg_content)
          except Exception as e:
              print(f'Nota al parchear build.gradle: {e}')
          "

      # 3. Compilar la APK de Release
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
