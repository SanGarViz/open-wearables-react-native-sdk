name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'native-android-sdk'

      # 2. Publicar el SDK nativo en un repositorio local dentro del proyecto (evita el aislamiento de ~/.m2)
      - name: Publicar SDK nativo en repositorio local del proyecto
        run: |
          cd native-android-sdk
          # Configurar la ruta del repositorio local dentro de example/android/local-repo
          LOCAL_REPO="../example/android/local-repo"
          chmod +x gradlew
          ./gradlew publish -Pversion=0.11.2 -PmavenRepoPath="$LOCAL_REPO" || ./gradlew publishToMavenLocal

      # 3. Instalar dependencias de la app de ejemplo
      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 4. Configurar el repositorio local personalizado en settings.gradle de la app
      - name: Registrar repositorio local en settings.gradle
        run: |
          python3 -c "
          settings_path = 'example/android/settings.gradle'
          with open(settings_path, 'r') as f:
              content = f.read()

          # Añadir el repositorio local de archivos al bloque dependencyResolutionManagement
          custom_repo = '''
          dependencyResolutionManagement {
              repositories {
                  maven { url uri('./local-repo') }
                  mavenLocal()
                  google()
                  mavenCentral()
                  maven { url 'https://www.jitpack.io' }
              }
          }
          '''

          if 'dependencyResolutionManagement' in content:
              # Reemplazar el bloque existente de repositories o inyectarlo
              import re
              new_content = re.sub(r'repositories\s*\{([^}]*)\}', 'repositories {\n        maven { url uri(\'./local-repo\') }\n\\1\n    }', content, count=1)
              with open(settings_path, 'w') as f:
                  f.write(new_content)
          else:
              with open(settings_path, 'a') as f:
                  f.write(custom_repo)
          print('Repositorio local configurado con éxito en settings.gradle')
          "

      # 5. Compilar la APK de Release con Gradle
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 6. Guardar la APK generada como artefacto descargable
      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
