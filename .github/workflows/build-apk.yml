name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      # 1. Clonar el SDK Nativo de Android directamente dentro de la estructura de node_modules/open-wearables/android
      # O clonarlo y enlazarlo antes de que Gradle lo busque
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'native-android-sdk'

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 2. Parchear de forma garantizada el build.gradle de open-wearables ahora que node_modules existe
      - name: Forzar enlace local del SDK nativo en open-wearables
        run: |
          python3 -c "
          import os

          # 1. Incluir el módulo sdk en settings.gradle de Android
          settings_path = 'example/android/settings.gradle'
          if os.path.exists(settings_path):
              with open(settings_path, 'r') as f:
                  content = f.read()
              
              include_snippet = '\ninclude \":sdk\"\nproject(\":sdk\").projectDir = new File(\"$rootDir/../../native-android-sdk/sdk\")\n'
              if ':sdk' not in content:
                  with open(settings_path, 'w') as f:
                      f.write(content + include_snippet)

          # 2. Reemplazar la dependencia remota por el proyecto local en node_modules/open-wearables/android/build.gradle
          target_bg = 'node_modules/open-wearables/android/build.gradle'
          if os.path.exists(target_bg):
              with open(target_bg, 'r') as f:
                  bg_content = f.read()
              
              # Reemplazar la línea de la dependencia por project(':sdk')
              import re
              new_content = re.sub(r'implementation\s*[\"\x27]com\.openwearables\.health:sdk:.*?[\"\x27]', 'implementation project(\":sdk\")', bg_content)
              
              with open(target_bg, 'w') as f:
                  f.write(new_content)
              print('Parche aplicado exitosamente en node_modules/open-wearables')
          else:
              print('Advertencia: No se encontró el archivo build.gradle de open-wearables en node_modules')
          "

      # 3. Compilar la APK de Release
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
