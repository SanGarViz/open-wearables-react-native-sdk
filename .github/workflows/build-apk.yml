name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código de la App
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      # --- NUEVO: Clonar y publicar el SDK Nativo de Android requeridos localmente ---
      - name: Clonar el SDK Android nativo de Open Wearables
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          token: ${{ secrets.GITHUB_TOKEN }} # Opcional si es público, requerido si es privado
          path: 'android-sdk-native'

      - name: Publicar el SDK Android en Maven Local
        run: |
          cd android-sdk-native
          chmod +x gradlew
          ./gradlew :sdk:publishReleasePublicationToMavenLocal

      # --------------------------------------------------------------------------

      - name: Instalar dependencias del SDK de React Native
        run: npm install

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar archivos nativos de Android (Expo Prebuild)
        run: |
          cd example
          npx expo prebuild --platform android

      - name: Conceder permisos a Gradle
        run: |
          cd example/android
          chmod +x gradlew

      - name: Compilar APK de Release con Gradle
        run: |
          cd example/android
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
