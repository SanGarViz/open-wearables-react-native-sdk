name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'example/android/native-sdk'

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 2. Registrar el submódulo en settings.gradle
      - name: Registrar submódulo nativo en settings.gradle
        run: |
          python3 -c "
          settings_path = 'example/android/settings.gradle'
          with open(settings_path, 'r') as f:
              content = f.read()

          include_snippet = '''
          include ':sdk'
          project(':sdk').projectDir = new File('native-sdk/sdk')
          '''

          if ':sdk' not in content:
              with open(settings_path, 'a') as f:
                  f.write(include_snippet)
          "

      # 3. Asegurar que el módulo :sdk tenga el plugin de Android y exponga sus variantes correctamente
      - name: Configurar plugins y variantes en el SDK nativo local
        run: |
          python3 -c "
          import os

          sdk_build_path = 'example/android/native-sdk/sdk/build.gradle'
          if os.path.exists(sdk_build_path):
              with open(sdk_build_path, 'r') as f:
                  content = f.read()

              # Asegurar que aplique el plugin de librería de Android si usa kotlin-multiplatform o java-library
              if 'com.android.library' not in content:
                  content = \"plugins { id 'com.android.library'\n }\n\" + content
              
              # Configurar publishing/variants si es necesario para que sea consumible
              with open(sdk_build_path, 'w') as f:
                  f.write(content)
              print('build.gradle del SDK nativo ajustado correctamente.')
          "

      # 4. Sustituir la dependencia remota por el proyecto local `:sdk`
      - name: Forzar sustitución de dependencia por el proyecto local
        run: |
          python3 -c "
          app_build_path = 'example/android/app/build.gradle'
          with open(app_build_path, 'r') as f:
              content = f.read()

          substitution_rule = '''
          configurations.all {
              resolutionStrategy.dependencySubstitution {
                  substitute module('com.openwearables.health:sdk') using project(':sdk')
              }
          }
          '''
          
          if 'dependencySubstitution' not in content:
              with open(app_build_path, 'a') as f:
                  f.write(substitution_rule)
          "

      # 5. Compilar la APK de Release con Gradle
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 6. Guardar la APK generada como artefacto descargable
      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
