name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android directamente dentro de la carpeta android de la app de ejemplo
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'example/android/native-sdk'

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 2. Modificar settings.gradle e inyectar el módulo nativo directamente en la compilación
      - name: Vincular el SDK nativo como submódulo local de Gradle
        run: |
          python3 -c "
          import os

          # Añadir el proyecto :sdk al settings.gradle de Android
          settings_path = 'example/android/settings.gradle'
          if os.path.exists(settings_path):
              with open(settings_path, 'r') as f:
                  content = f.read()
              
              include_snippet = '\ninclude \":sdk\"\nproject(\":sdk\").projectDir = new File(\"native-sdk/sdk\")\n'
              if ':sdk' not in content:
                  with open(settings_path, 'w') as f:
                      f.write(content + include_snippet)
                  print('Módulo :sdk añadido a settings.gradle')

          # Reemplazar la dependencia remota en el build.gradle del paquete de npm si existe,
          # o forzar la sustitución por el proyecto local.
          "

      # 3. Forzar a Gradle a usar el proyecto local mediante un dependency substitution global en build.gradle principal
      - name: Forzar sustitución de dependencia por el proyecto local
        run: |
          python3 -c "
          root_build_gradle = 'example/android/build.gradle'
          with open(root_build_gradle, 'r') as f:
              content = f.read()

          substitution_block = '''
          allprojects {
              configurations.all {
                  resolutionStrategy.dependencySubstitution {
                      substitute module('com.openwearables.health:sdk') using project(':sdk')
                  }
              }
          }
          '''
          
          with open(root_build_gradle, 'a') as f:
              f.write(substitution_block)
          print('Estrategia de sustitución de dependencias inyectada correctamente.')
          "

      # 4. Compilar la APK de Release
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
