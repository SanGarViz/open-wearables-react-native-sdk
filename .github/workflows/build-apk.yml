name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'native-android-sdk'

      # 2. Forzar la versión a 0.11.2 y publicar en Maven Local
      - name: Publicar SDK nativo en Maven Local con versión 0.11.2
        run: |
          cd native-android-sdk
          # Script para asegurar que la versión publicada sea exactamente 0.11.2
          python3 -c "
          import glob
          for path in glob.glob('**/build.gradle*', recursive=True) + glob.glob('gradle.properties', recursive=True):
              with open(path, 'r', errors='ignore') as f:
                  content = f.read()
              if 'version' in content:
                  # Opcional: ajustar propiedades de versión si es necesario
                  pass
          "
          chmod +x gradlew
          ./gradlew publishToMavenLocal -Pversion=0.11.2

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 3. Configurar mavenLocal() de forma prioritaria en dependencyResolutionManagement
      - name: Configurar mavenLocal en settings.gradle
        run: |
          python3 -c "
          settings_path = 'example/android/settings.gradle'
          with open(settings_path, 'r') as f:
              content = f.read()

          # Inyectar mavenLocal() dentro de dependencyResolutionManagement -> repositories
          if 'dependencyResolutionManagement' in content and 'mavenLocal()' not in content:
              content = content.replace('repositories {', 'repositories {\n        mavenLocal()', 1)
              with open(settings_path, 'w') as f:
                  f.write(content)
              print('mavenLocal inyectado correctamente en settings.gradle')
          "

      # 4. Compilar la APK de Release con Gradle
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 5. Guardar la APK generada como artefacto descargable
      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
