name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android de Open Wearables
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'native-android-sdk'

      # 2. Publicar el SDK nativo en Maven Local de la máquina virtual
      - name: Publicar SDK nativo en Maven Local
        run: |
          cd native-android-sdk
          chmod +x gradlew
          ./gradlew :sdk:publishReleasePublicationToMavenLocal

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 3. Inyectar mavenLocal() de forma segura en el nivel raíz de repositories de gradle
      - name: Configurar mavenLocal en repositories globales
        run: |
          python3 -c "
          import glob
          
          # Buscar archivos build.gradle o settings.gradle donde configurar repositorios
          files = glob.glob('example/android/**/*.gradle', recursive=True) + glob.glob('example/android/*.gradle')
          
          for path in files:
              with open(path, 'r') as f:
                  content = f.read()
              
              if 'repositories {' in content and 'mavenLocal()' not in content:
                  # Agregar mavenLocal() al inicio de cada bloque repositories
                  new_content = content.replace('repositories {', 'repositories {\n        mavenLocal()', 1)
                  with open(path, 'w') as f:
                      f.write(new_content)
                  print(f'mavenLocal inyectado en: {path}')
          "

      # 4. Compilar la APK de Release
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
