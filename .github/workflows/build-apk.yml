name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias principales del SDK
        run: npm install

      # 1. Compilar y publicar el SDK Nativo de Android en Maven Local
      - name: Publicar SDK nativo de Android localmente
        run: |
          chmod +x gradlew
          ./gradlew :sdk:publishReleasePublicationToMavenLocal

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      - name: Dar permisos de ejecución a Gradle en la app
        run: |
          cd example/android
          chmod +x gradlew

      - name: Compilar APK de Release
        run: |
          cd example/android
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
