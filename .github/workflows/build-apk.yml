name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android de Open Wearables
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'native-android-sdk'

      # 2. Publicar correctamente el SDK nativo usando publishToMavenLocal dentro de su entorno
      - name: Compilar y publicar SDK nativo en Maven Local
        run: |
          cd native-android-sdk
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 3. Asegurar que mavenLocal() esté presente en los repositorios de la app de ejemplo
      - name: Inyectar mavenLocal en el repositorio de Gradle de la app
        run: |
          python3 -c "
          settings_path = 'example/android/settings.gradle'
          with open(settings_path, 'r') as f:
              content = f.read()

          maven_local_repo = '''
          dependencyResolutionManagement {
              repositories {
                  mavenLocal()
                  google()
                  mavenCentral()
                  maven { url 'https://www.jitpack.io' }
              }
          }
          '''
          
          # Si no usa dependencyResolutionManagement, lo añadimos o lo inyectamos
          if 'dependencyResolutionManagement' not in content:
              with open(settings_path, 'a') as f:
                  f.write('\ndependencyResolutionManagement { repositories { mavenLocal(); google(); mavenCentral(); maven { url \"https://www.jitpack.io\" } } }\n')
          "

      # 4. Compilar la APK de Release
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
