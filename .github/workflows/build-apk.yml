name: Build Open Wearables APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código principal (SDK React Native)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: example/package-lock.json

      - name: Instalar dependencias del SDK principal
        run: npm install

      # 1. Clonar el SDK Nativo de Android de Open Wearables
      - name: Clonar SDK Nativo Android
        uses: actions/checkout@v4
        with:
          repository: 'the-momentum/open_wearables_android_sdk'
          path: 'native-android-sdk'

      # 2. Publicar el SDK nativo en Maven Local
      - name: Compilar y publicar SDK nativo en Maven Local
        run: |
          cd native-android-sdk
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Instalar dependencias de la app de ejemplo
        run: |
          cd example
          npm install

      - name: Generar código nativo Android con Expo
        run: |
          cd example
          npx expo prebuild --platform android

      # 3. Inyectar mavenLocal() explícitamente en el bloque build.gradle de la app generada por Expo
      - name: Agregar mavenLocal en el build.gradle de Android
        run: |
          python3 -c "
          build_path = 'example/android/build.gradle'
          with open(build_path, 'r') as f:
              content = f.read()

          # Inyectar mavenLocal() en el primer bloque 'repositories' que encuentre
          target = 'repositories {'
          if 'mavenLocal()' not in content:
              new_content = content.replace(target, 'repositories {\n        mavenLocal()', 1)
              with open(build_path, 'w') as f:
                  f.write(new_content)
              print('mavenLocal inyectado con éxito en build.gradle')
          else:
              print('mavenLocal ya estaba presente en build.gradle')
          "

      # 4. Compilar la APK de Release
      - name: Compilar APK de Release
        run: |
          cd example/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OpenWearables-App-Release
          path: example/android/app/build/outputs/apk/release/*.apk
